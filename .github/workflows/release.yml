name: Release

on:
  # 本副本不发 GitHub Release：仓库私有、包标 private，分发只走本机 npm pack 产物。
  # 保留手动入口，需要临时出包时在 Actions 里点一次。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xiuchuan666/dsh-purge-maintained'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify source and regression tests
        run: npm run check

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "already published: $tag"
            exit 0
          fi
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          zip="dsh-purge-${version}.zip"
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
            gh release create "$tag" --title "$tag" --notes-file release-notes.md
          else
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
