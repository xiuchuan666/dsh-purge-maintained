name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # npm run check covers syntax, metadata, line endings, the client bundle, the gate table
      # (check:gates) and the regression suite. Only the gate table can be checked here: every
      # host-side command (host:snapshot / host:choke / host:outcome / host:matrix / host:gates)
      # needs an installed host tree, which this runner does not have.
      - name: Verify source, gate table and regression tests
        run: npm run check
